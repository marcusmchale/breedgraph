interface ReferenceInterface {
    id: ID!
    description: String
}

enum ReferenceType {
    LEGAL
    EXTERNAL
    FILE
    EXTERNAL_DATA
    DATA_FILE
}

""" How a legal reference's text is written """
enum TextFormat {
    """ Shown as it is written """
    PLAIN
    """ Rendered as markdown """
    MARKDOWN
}

"""
Legal text, such as a study's licence: typed, or read from a .txt, .md or .pdf file, which is kept for download
"""
type LegalReference implements ReferenceInterface {
    id: ID!
    description: String

    text: String
    textFormat: TextFormat!
    """
    The SHA-256 of the file the text was read from, or of the typed text: what accepting the reference names. It
    changes with the text. Null on a placeholder
    """
    contentHash: String
    """ Read from a file: its name and type, and its id for referencesFileDownload once it is saved """
    filename: String
    contentType: String
    fileId: ID
    """
    Whether the request carries an acceptance of this reference's current text, as a study's licence (licencesAccept),
    for its user or a visitor who isn't signed in
    """
    accepted: Boolean!
}

type ExternalReference implements ReferenceInterface {
    id: ID!
    description: String

    url: String
    externalId: String
}

type FileReference implements ReferenceInterface {
    id: ID!
    description: String

    filename: String
    fileId: ID
    contentType: String
    """ The Persons credited, with the roles they had """
    contributions: [Contribution]
}

type ExternalDataReference implements ReferenceInterface {
    id: ID!
    description: String

    url: String
    externalId: String

    format: DataFormat
    schema: String
    """ The Persons credited, with the roles they had """
    contributions: [Contribution]
}

type DataFileReference implements ReferenceInterface {
    id: ID!
    description: String

    filename: String
    fileId: ID
    contentType: String

    format: DataFormat
    schema: String
    """ The Persons credited, with the roles they had """
    contributions: [Contribution]
}

type FileSubmission {
    referenceId: ID
    status: SubmissionStatus
    progress: Int
    errors: [String]
}

enum FileStatus {
    ARCHIVED
    RETRIEVING
    AVAILABLE
    FAILED
}

type FileRetrieval {
    startedAt: DateTime
    progress: Int
}

type FileDownloadState {
    status: FileStatus!
    progress: FileRetrieval
}

type FileDownload {
    expiresAt: DateTime!
    url: String!
}


union ReferenceUnion = LegalReference | ExternalReference | ExternalDataReference | DataFileReference | FileReference