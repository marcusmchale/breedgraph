interface ReferenceInterface {
    id: ID!
    description: String
}

enum ReferenceType {
    LEGAL
    EXTERNAL
    FILE
    EXTERNAL_DATA
    DATA_FILE
}

type LegalReference implements ReferenceInterface {
    id: ID!
    description: String

    text: String
}

type ExternalReference implements ReferenceInterface {
    id: ID!
    description: String

    url: String
    externalId: String
}

type FileReference implements ReferenceInterface {
    id: ID!
    description: String

    filename: String
    fileId: ID
    contentType: String
    """ The Persons credited, with the roles they had """
    contributions: [Contribution]
}

type ExternalDataReference implements ReferenceInterface {
    id: ID!
    description: String

    url: String
    externalId: String

    format: DataFormat
    schema: String
    """ The Persons credited, with the roles they had """
    contributions: [Contribution]
}

type DataFileReference implements ReferenceInterface {
    id: ID!
    description: String

    filename: String
    fileId: ID
    contentType: String

    format: DataFormat
    schema: String
    """ The Persons credited, with the roles they had """
    contributions: [Contribution]
}

type FileSubmission {
    referenceId: ID
    status: SubmissionStatus
    progress: Int
    errors: [String]
}

enum FileStatus {
    ARCHIVED
    RETRIEVING
    AVAILABLE
    FAILED
}

type FileRetrieval {
    startedAt: DateTime
    progress: Int
}

type FileDownloadState {
    status: FileStatus!
    progress: FileRetrieval
}

type FileDownload {
    expiresAt: DateTime!
    url: String!
}


union ReferenceUnion = LegalReference | ExternalReference | ExternalDataReference | DataFileReference | FileReference