type GeoCoordinate {
    """Latitude in degrees according to ISO 6709"""
    latitude: Float!
    """Longitude in degrees according to ISO 6709"""
    longitude: Float!
    """Meters above WGS84 reference ellipsoid"""
    altitude: Float
    """Uncertainty in meters associated with these coordinates"""
    uncertainty: Float
    """Additional coordinate description"""
    description: String
}

type Location {
    """
    Stored Locations
    """
    id: ID!
    name: String!
    type: LocationType
    code: String
    synonyms: [String]
    description: String
    address: String
    coordinates: [GeoCoordinate]
    """ The root location for this location tree, for the root location this references itself. """
    root: Location
    parent: Location
    children: [Location]
}

""" Locations below some locations that share a type, as id and name """
type LocationTypeLocations {
    type: LocationType
    locations: [Location!]!
}


type LocationTemplate {
    name: String!
    """ Optional code for location, e.g. zip-code """
    code: String
    description: String
    address: String
    coordinates: [GeoCoordinate]
    """ Ontology LocationType identifier """
    typeId: ID!
}

"""Where a country's or a section's detailed maps stand"""
enum MapState {
    """Never asked for, or asked for where this site fetches no detailed maps"""
    NONE
    """Asked for: being outlined and measured before they are fetched"""
    PENDING
    """Being fetched"""
    FETCHING
    READY
    """A country too large to fetch whole, whose sections are fetched as locations in them are placed on the map"""
    DIVIDED
    FAILED
}

"""A section of a country too large to fetch whole, such as a state or province"""
type MapSectionStatus {
    name: String!
    state: MapState!
    """The size of its detailed maps in bytes, once measured"""
    size: Float
    """Why they could not be fetched"""
    error: String
}

"""The detailed maps of a country on this site"""
type CountryMapStatus {
    code: String!
    state: MapState!
    """The size of its detailed maps in bytes, once measured"""
    size: Float
    """In bytes: the size above which a country is fetched by its sections, and a section is not fetched"""
    limit: Float!
    """Whether this site fetches detailed maps"""
    enabled: Boolean!
    """Why they could not be fetched"""
    error: String
    """For a divided country, the sections fetched, being fetched or that failed"""
    sections: [MapSectionStatus!]!
}

"""A place found by name, to move the location map to"""
type Place {
    name: String!
    latitude: Float!
    longitude: Float!
    """[[south, west], [north, east]], when known"""
    bounds: [[Float!]!]
}
