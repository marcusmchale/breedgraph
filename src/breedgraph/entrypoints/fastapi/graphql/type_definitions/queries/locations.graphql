type GeoCoordinate {
    """Latitude in degrees according to ISO 6709"""
    latitude: Float!
    """Longitude in degrees according to ISO 6709"""
    longitude: Float!
    """Meters above WGS84 reference ellipsoid"""
    altitude: Float
    """Uncertainty in meters associated with these coordinates"""
    uncertainty: Float
    """Additional coordinate description"""
    description: String
}

type Location {
    """
    Stored Locations
    """
    id: ID!
    name: String!
    type: LocationType
    code: String
    synonyms: [String]
    description: String
    address: String
    coordinates: [GeoCoordinate]
    """ The root location for this location tree, for the root location this references itself. """
    root: Location
    parent: Location
    children: [Location]
}

""" Locations below some locations that share a type, as id and name """
type LocationTypeLocations {
    type: LocationType
    locations: [Location!]!
}


type LocationTemplate {
    name: String!
    """ Optional code for location, e.g. zip-code """
    code: String
    description: String
    address: String
    coordinates: [GeoCoordinate]
    """ Ontology LocationType identifier """
    typeId: ID!
}

"""A place found by name, to move the location map to"""
type Place {
    name: String!
    latitude: Float!
    longitude: Float!
    """[[south, west], [north, east]], when known"""
    bounds: [[Float!]!]
}
