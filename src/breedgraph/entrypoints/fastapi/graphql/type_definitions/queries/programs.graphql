type DatasetScope {
    datasetIds: [ID!]!
}

type RecordGrouping {
    id: ID!
    type: RecordGroupType!
    name: String!
    scope: GroupingScope!
    """ How analysis groups records with the same code across units """
    extent: RecordGroupExtent!
    dataset_scopes: [DatasetScope!]
}

type Program {
    id: ID!
    name: String!
    fullname: String
    description: String
    contacts: [Person]
    """ The Persons credited, with the roles they had """
    contributions: [Contribution]
    references: [ReferenceInterface]
    trials: [Trial]
}

type Trial {
    id: ID!
    name: String!
    fullname: String
    description: String
    start: DateTime
    end: DateTime
    contacts: [Person]
    """ The Persons credited, with the roles they had """
    contributions: [Contribution]
    references: [ReferenceInterface]
    studies: [Study]
}

type Study {
    id: ID!
    name: String!
    fullname: String
    description: String
    practices: String
    start: DateTime
    end: DateTime
    groupings: [RecordGrouping!]
    design: Design
    licence: LegalReference
    references: [ReferenceInterface]
}
