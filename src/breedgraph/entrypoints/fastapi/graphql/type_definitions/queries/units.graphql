type Position {
    """
    ID of Location in a LocationTree
    """
    location: Location!
    """
    ID of Layout in and LayoutTree
    """
    layout: Layout
    """
    Coordinates should be a list of values corresponding to the stored layout axes.
    """
    coordinates: [String]
    start: DateTime
    end: DateTime
}

type Unit {
    id: ID!

    subject: Subject
    germplasm: GermplasmEntry

    name: String
    description: String
    positions: [Position]

    parents: [Unit]
    children: [Unit]
    """
    The units above it, closest first: those you can read, found through hidden ones as parents are, and its unit
    graph's root, a placeholder when hidden. None for a unit you cannot read. Read for every unit of the request at once.
    """
    ancestors: [Unit!]!
    """
    Without germplasm of its own, the germplasm of the nearest units above it with some, as analysis takes it: one on
    each lineage (a path up stops at the first unit with germplasm), which must agree. Null with its own, with none
    above, when they differ (e.g. a sample pooled from trees of two varieties), or when one is hidden from you.
    Read for every unit of the request at once.
    """
    inheritedGermplasm: InheritedGermplasm
    """
    The units its material came from, e.g. the microcuttings plantlets grew from: unlike parents, they pass nothing
    down (germplasm, place, factors), so the unit starts a context of its own. Placeholders where hidden.
    Empty for a unit you cannot read.
    """
    derivedFrom: [UnitDerivation!]!
    """
    The units derived from it that you can read. Read for every unit of the request that asks, at once.
    """
    derivatives: [UnitDerivation!]!
}

""" A unit's material came from another: the unit at the other end of the link, and the stage it was at """
type UnitDerivation {
    """ The unit it came from in derivedFrom, the unit derived from it in derivatives """
    unit: Unit!
    stage: DerivationStage!
    """ e.g. the approximate stage of a plant, or how a graft was formed """
    description: String
}

"""
The form material was in when it became a unit derived from another: a physical stage, not a genetic relationship,
which germplasm entries describe. A graft is derived from several units, each at its own stage, e.g. a scion as a
CUTTING and its rootstock as a SEEDLING; how they were joined goes in the description.
"""
enum DerivationStage {
    UNKNOWN
    """ Seed, or a seed lot """
    SEED
    """ A young plant grown from seed """
    SEEDLING
    """ An unrooted vegetative piece: a stem or nodal cutting, budwood, a scion, a bud chip """
    CUTTING
    """ A rooted vegetative piece """
    ROOTED_CUTTING
    """ An established whole plant: give its approximate stage in the description """
    PLANT
    """
    Material in culture: an explant, callus, somatic embryos, embryo rescue, anther or microspore culture, a
    micro-graft, a cryopreserved shoot tip
    """
    IN_VITRO
    """ In vitro material acclimatised ex vitro """
    PLANTLET
}

""" Germplasm a unit takes from the units above it """
type InheritedGermplasm {
    germplasm: GermplasmEntry!
    """ The nearest unit above with this germplasm """
    unit: Unit!
}

""" Units below some units that share a subject, as id and name """
type SubjectUnits {
    subject: Subject
    units: [Unit!]!
}

"""
Units that came to a location together from elsewhere in their unit graphs, e.g. samples sent to a lab: the readable
units, not unit graph roots, with a position at the location from the same start, as entered, whose parents were not
there then. A unit is where its own position at a time puts it, else where its parent is. Positions have no identity,
so an arrival is known by its location and start: read its units with unitsArrivalUnits.
"""
type UnitArrival {
    location: Location!
    """ The start of their positions there, as entered; null for units there without one """
    start: DateTime
    unitCount: Int!
    """ Its units with units derived from them that you can read, e.g. microcuttings planted as plantlets """
    derivedUnitCount: Int!
    """
    Its units still there, with nothing derived from them: none when the arrival is settled, its units derived from,
    moved on or used up
    """
    pendingUnitCount: Int!
    """ The roots of the unit graphs they came from, placeholders where hidden """
    roots: [Unit!]!
    """ Its units by subject, as id and name, e.g. for selecting them all at once """
    unitsBySubject: [SubjectUnits!]!
}
