type Position {
    """
    ID of Location in a LocationTree
    """
    location: Location!
    """
    ID of Layout in and LayoutTree
    """
    layout: Layout
    """
    Coordinates should be a list of values corresponding to the stored layout axes.
    """
    coordinates: [String]
    start: DateTime
    end: DateTime
}

type Unit {
    id: ID!

    subject: Subject
    germplasm: GermplasmEntry

    name: String
    description: String
    positions: [Position]

    parents: [Unit]
    children: [Unit]
}

""" Units below some units that share a subject, as id and name """
type SubjectUnits {
    subject: Subject
    units: [Unit!]!
}
