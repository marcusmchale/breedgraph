type RecordGroup {
    id: ID!
    code: String!
}

type Record {
    id: ID!
    unit: Unit
    value: String
    start: DateTime
    end: DateTime
    groups: [RecordGroup!]
    references: [ReferenceInterface]
    submitted: DateTime
}

""" The codes of one record grouping that a dataset's records carry """
type GroupingCodes {
    groupingId: ID!
    codes: [String!]!
}

"""
What a dataset's records span, read without the records themselves, so that pickers and binning suggestions
need not load them
"""
type DatasetDimensions {
    recordCount: Int!
    unitCount: Int!
    """ The earliest and latest record time, either of start and end standing in for a missing other """
    start: DateTime
    end: DateTime
    """ The record times, every start and end, at percentiles 0 to 100; empty when no record has a time """
    timePercentiles: [DateTime!]!
    """
    The record values at percentiles 0 to 100, in numeric order when every value is a number and in text order
    otherwise; empty when no record has a value
    """
    valuePercentiles: [String!]!
    """ The record group codes present, by grouping, each in text order """
    groups: [GroupingCodes!]!
}

"""
A location that analysis position grouping could place the records of datasets at (Query.datasetsPlaces)
"""
type DatasetPlace {
    location: Location!
    """ The datasets' recorded units placed there, through their own positions or those of the units above them """
    unitCount: Int!
    """ The layouts of the positions placing them, in id order """
    layouts: [DatasetPlaceLayout!]!
}

type DatasetPlaceLayout {
    layout: Layout!
    """ The datasets' recorded units placed in it """
    unitCount: Int!
    """
    The axis names a position in the layout has values on: its own, then those of the layouts above it, up to one
    the user can't read
    """
    axes: [String!]!
}

"""
A dataset. One the user cannot read, asked for by id, is a placeholder: its id, with no study or concept, and no records.
"""
type Dataset {
    id: ID!
    studyId: ID
    # concept is either a Factor or Variable in the ontology
    concept: OntologyNodeInterface
    """
    The dataset's records, in submission order. Without arguments, all of them.
    unitIds narrows them to the records of those units and of every unit below the readable ones (a unit graph or a plot
    selects what it contains; a hidden unit only its own records); start and end to records whose own period overlaps the window;
    offset and limit page through the result. With includeBelow false, unitIds narrows them to the records of exactly
    those units, e.g. the factor records of the units above some units.
    """
    records(unitIds: [ID!], start: DateTime, end: DateTime, offset: Int, limit: Int, includeBelow: Boolean): [Record]
    """ The number of records in the dataset, narrowed like records when the same arguments are given """
    recordCount(unitIds: [ID!], start: DateTime, end: DateTime): Int!
    """
    The ids of the units the dataset has records for, in id order, narrowed like records when the same arguments
    are given: a client pages by unit with these, so that every record of a unit is in the same page
    """
    unitIds(unitIds: [ID!], start: DateTime, end: DateTime): [ID!]!
    """ What the records span, without reading them; null for a dataset the user cannot read """
    dimensions: DatasetDimensions
    """ The Persons credited, with the roles they had """
    contributions: [Contribution]
    references: [ReferenceInterface]
    """
    The licence of the dataset's study. Unless licenceRequired is false, records and dimensions are refused
    (LICENCE_NOT_ACCEPTED) until the request carries an acceptance of its current text (licencesAccept), as are
    analyses of the dataset and downloads of the files its records cite (docs/licences.md §5)
    """
    licence: LegalReference
    """
    Whether the user must accept the licence to get the dataset's records: false without a licence, and for readers
    through a controlling team of the dataset or its study, who make their own agreements
    """
    licenceRequired: Boolean!
}

"""
A unit some datasets have records for, at it or below it: one node of the tree of units that matter to those
datasets, for narrowing their records to units
"""
type DatasetsUnit {
    unit: Unit!
    """ The number of units at or below this one that the datasets have records for, under the narrowing """
    unitCount: Int!
    """ The number of those records """
    recordCount: Int!
    """ Whether a unit below this one has records: whether there is a level to open under it """
    hasChildren: Boolean!
}

type SubmittedRecord {
    id: ID  # may be null if a new record, or provided if an update
    unitId: Int!
    value: String
    start: DateTime
    end: DateTime
    groups: [RecordGroup!]
    referenceIds: [Int]
}

type SubmittedData {
    conceptId: ID!
    records: [SubmittedRecord]
    """ The Persons credited, with the roles they had """
    contributions: [Contribution]
    references: [ReferenceInterface]
}

enum SubmissionStatus {
    PENDING
    QUEUED
    PROCESSING
    COMPLETED
    FAILED
}

type ItemError {
    index: Int!
    error: String!
}

type DatasetSubmission {
    datasetId: ID
    data: SubmittedData
    status: SubmissionStatus
    errors: [String]
    itemErrors: [ItemError]
}

type DatasetSummary {
    id: ID!
    concept: OntologyNodeInterface!,
    subjects: [Subject]
    locations: [Location]
    unitRoots: [Unit]
    unit_count: Int!
    record_count: Int!
    start: DateTime
    end: DateTime
}
