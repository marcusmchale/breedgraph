type RecordGroup {
    id: ID!
    code: String!
}

type Record {
    id: ID!
    unit: Unit
    value: String
    start: DateTime
    end: DateTime
    groups: [RecordGroup!]
    references: [ReferenceInterface]
    submitted: DateTime
}

type Dataset {
    id: ID!
    studyId: ID!
    # concept is either a Factor or Variable in the ontology
    concept: OntologyNodeInterface!
    """
    The dataset's records, in submission order. Without arguments, all of them.
    unitIds, start and end narrow them (a record matches start/end when its own start/end lies within);
    offset and limit page through the result.
    """
    records(unitIds: [ID!], start: DateTime, end: DateTime, offset: Int, limit: Int): [Record]
    """ The number of records in the dataset, before any narrowing """
    recordCount: Int!
    contributors: [Person]
    references: [ReferenceInterface]
}

type SubmittedRecord {
    id: ID  # may be null if a new record, or provided if an update
    unitId: Int!
    value: String
    start: DateTime
    end: DateTime
    groups: [RecordGroup!]
    referenceIds: [Int]
}

type SubmittedData {
    conceptId: ID!
    records: [SubmittedRecord]
    contributors: [Person]
    references: [ReferenceInterface]
}

enum SubmissionStatus {
    PENDING
    QUEUED
    PROCESSING
    COMPLETED
    FAILED
}

type ItemError {
    index: Int!
    error: String!
}

type DatasetSubmission {
    datasetId: ID
    data: SubmittedData
    status: SubmissionStatus
    errors: [String]
    itemErrors: [ItemError]
}

type DatasetSummary {
    id: ID!
    concept: OntologyNodeInterface!,
    subjects: [Subject]
    locations: [Location]
    blocks: [Unit]
    unit_count: Int!
    record_count: Int!
    start: DateTime
    end: DateTime
}
