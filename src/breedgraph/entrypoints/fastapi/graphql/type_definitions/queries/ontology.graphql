}




union OntologyEntryUnion = Term | Subject | Trait | Condition | Scale | ObservationMethod | Variable | ControlMethod | Factor | Event | LocationType | LayoutType | Design | RecordGroupType | Role

type OntologyRelationship {
    id: ID!
    versionId: ID!
    view: OntologyView!

    phase: LifecyclePhase!

    sourceId: ID!
    targetId: ID!
    label: OntologyRelationshipLabel!
}

"""
An ontology snapshot for a specific version and view.
"""
type Ontology {
    version: Version!
    view: OntologyView!

    """
    The ontology entities materialized for this snapshot.
    """
    entries: [OntologyEntryUnion!]!

    """
    A graph representation of the relationships between entries in this
    snapshot. This is provided as a convenience for graph-oriented clients
    such as visualizations.
    """
    relationships: [OntologyRelationship!]!
}
