"""
Scale entries describe the units, classes or dimensions for values associated with a Variable or Factor.
Scale entries require a ScaleType.
Nominal and Ordinal scales have categories, in order: an ordinal scale's order is the rank of its categories.

Complex scales allow for the description of data that cannot be represented by simple values (integer, float, string), nor by
the categories of nominal or ordinal scales.
Examples:
"Centimeters", "Counts per million", "Micro-Einsteins" are all ScaleType numerical.
"MAG abundance" would be ScaleType complex, with associated datasets or records each providing references to stored files, e.g. in HDF5 format.

"""
interface ScaleInterface {
    scaleType: ScaleType!
}

interface ScaleRelationships {
    variables: [Variable!]
    factors: [Factor!]
}

type Scale implements OntologyNodeInterface & ScaleInterface & OntologyRelationships & RelatedToTerms & ScaleRelationships {
    id: ID!
    versionId: ID!
    view: OntologyView!

    phase: LifecyclePhase!

    name: String!

    description: String
    abbreviation: String
    synonyms: [String!]
    """ For an entry taken from an external standard or ontology: its URL, and how to attribute it """
    sourceUrl: String
    sourceAttribution: String
    """ A locked scale keeps its name, abbreviation, description, source, categories and defining relationships, and cannot be deprecated """
    locked: Boolean!

    references: [ReferenceInterface!]

    scaleType: ScaleType!
    """
    The categories of a nominal or ordinal scale, in order: an ordinal scale's order is the rank of its categories.
    Records hold a category's name.
    """
    categories: [ScaleCategory!]!

    parents: [Scale!]
    children: [Scale!]

    terms: [Term!]

    variables: [Variable!]
    factors: [Factor!]
}

"""
A category of a nominal or ordinal scale: part of the scale, not an ontology entry.
Its name is unique on the scale, ignoring case, and its description says what it means on this scale.
"""
type ScaleCategory {
    name: String!
    description: String
}

