type DescriptiveStatisticsConfig {
  """
  Terms for which descriptive statistics are calculated.
  """
  terms: [AnalysisTerm!]!

  """
  Dimensions used to construct analytical observations.
  """
  grouping: AnalysisGrouping

  """
  Interactions between terms used when calculating
  model-dependent statistics such as least-squares means.
  """
  interactions: [InteractionTerm!]!

  """
  Estimated marginal means requested.
  """
  estimatedMeans: [EstimatedMeansConfig!]!
}


type DescriptiveStatisticsResult {
  """
  ID of the analysis that produced the result.
  """
  analysisId: ID!

  """
  Descriptive statistics calculated for the requested terms.
  """
  terms: [DescriptiveTermResult!]!

  """
  Estimated marginal means (least-squares means) when requested.
  """
  estimatedMeans: [EstimatedMeansResult!]!
}


type DescriptiveTermResult {
  """
  Term for which statistics were calculated.
  """
  term: AnalysisTermReference!

  """
  Levels of the categorical and ordinal terms for which the statistics
  were calculated. Empty for statistics over all observations.
  """
  levels: [AnalysisTermLevel!]!

  """
  Analytical group represented by this result, when all levels are
  of domain terms.
  """
  group: AnalysisGroup

  """
  Number of observations.
  """
  count: Int!

  """
  Number of missing observations.
  """
  missingCount: Int!

  mean: Float

  standardDeviation: Float

  standardError: Float

  median: Float

  minimum: Float

  maximum: Float

  lowerQuartile: Float

  upperQuartile: Float
}


type AnalysisGroup {
  """
  Time grouping represented by this group.
  """
  time: String

  """
  Germplasm grouping represented by this group.
  """
  germplasmId: ID

  """
  Unit grouping represented by this group.
  """
  unitId: ID

  """
  Location represented by this group.
  """
  locationId: ID

  """
  Layout represented by this group, when the layout is a dimension.
  """
  layoutId: ID

  """
  Layout axis values represented by this group.
  """
  layoutAxes: [AnalysisLayoutAxisLevel!]!

  """
  Study represented by this group, when a STUDY term is used.
  """
  studyId: ID

  """
  Record group levels represented by this group.
  """
  recordGroups: [AnalysisRecordGroupAssignment!]!

}


"""
The value of a layout axis represented by a group.
"""
type AnalysisLayoutAxisLevel {
  """
  Name of the axis.
  """
  axis: String!

  """
  ID of the layout that has the axis; values are nested in it.
  """
  layoutId: ID!

  value: String!
}


"""
The level of a record group dimension represented by a group.
"""
type AnalysisRecordGroupAssignment {
  """
  Name of the dimension.
  """
  dimension: String!

  """
  Identifier of the level, unique within the dimension.

  The label of a shared level, "unit|<unitId>" for a unit level, otherwise an identifier
  composed of grouping, scope, code and, for WITHIN_UNIT groupings, the base unit,
  or for WITHIN_GRAPH groupings, the root of the base unit's graph.
  """
  level: String!

  """
  Whether the level is a shared level.
  """
  shared: Boolean!

  """
  Grouping of a nested level. Null for shared levels and unit levels.
  """
  groupingId: ID

  """
  Datasets of the scope of a nested level.

  Null for study-wide groupings and shared levels.
  """
  scopeDatasetIds: [ID!]

  """
  Code of a nested level.
  """
  code: String

  """
  The unit of a unit level, a unit of one of the dimension's subjects.
  Otherwise the base unit of a nested level of a WITHIN_UNIT grouping, whose codes are only comparable within a unit,
  or the root of the base unit's graph for a WITHIN_GRAPH grouping, whose codes are only comparable within a graph.
  """
  unitId: ID
}