type OutlierDetectionConfig {
  """
  Terms used to identify potential outliers.
  """
  terms: [AnalysisTerm!]!

  """
  Dimensions used to construct analytical observations.
  """
  grouping: AnalysisGrouping

  """
  Method used to identify potential outliers.
  """
  method: OutlierDetectionMethod!
}


type OutlierDetectionResult {
  """
  ID of the analysis that produced the result.
  """
  analysisId: ID!

  """
  Detected potential outliers.
  """
  outliers: [OutlierResult!]!
}


type OutlierResult {
  """
  Analytical observation identified as a potential outlier.
  """
  observation: AnalysisGroup!

  """
  A rule excluding the records of the observation, which can be
  supplied as an exclusion to a subsequent analysis.

  Built from the contributing base units, the time bin and
  the record group members of the observation.
  """
  exclusion: AnalysisExclusion!

  """
  Term for which the observation was identified as an outlier.
  Null for multivariate methods.
  """
  term: AnalysisTermReference

  """
  Value associated with the observation.
  """
  value: Float

  """
  Score or statistic used to identify the outlier.
  """
  score: Float
}
