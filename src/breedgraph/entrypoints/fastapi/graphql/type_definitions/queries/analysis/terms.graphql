"""
A resolved analysis term.

A term may represent a concept or a domain dimension such as
time, germplasm, unit, position, record group or study.
"""
type AnalysisTerm {
  """
  Identifies the term.
  """
  reference: AnalysisTermReference!

  """
  Representation used for the term, where applicable.
  """
  representation: TermRepresentationType

  """
  Binning applied to the term.
  """
  binning: Binning

  """
  Explicit ordering of categorical or ordinal levels.
  """
  levelOrder: [String!]

  """
  Transformations applied to the term.
  """
  transformations: [TermTransformation!]!

  """
  Aggregation applied when multiple records contribute
  to an analytical observation.
  """
  aggregation: TermAggregation

  """
  Combines the replicates of a reading (codes of WITHIN_UNIT record groupings)
  before the term's aggregation.
  """
  replicateAggregation: ReplicateAggregation

  """
  Statistical effect of the term when a statistical model is used.
  """
  effect: TermEffect
  """
  Terms whose effects may vary as random slopes for this term.
  """
  randomSlopeTerms: [AnalysisTermReference!]
}


"""
Identifies a term used by an analysis.

Concept terms are identified by conceptId, record group terms by
their dimension. Other domain terms are identified by their type.
"""
type AnalysisTermReference {
  """
  Type of term.
  """
  type: AnalysisTermType!

  """
  Stable concept ID when the term represents a concept.
  """
  conceptId: ID

  """
  Record group dimension when the term represents a record group.
  """
  recordGroupDimension: AnalysisRecordGroupDimension
}


type InteractionTerm {
  """
  Terms participating in the interaction.
  """
  terms: [AnalysisTermReference!]!
}

"""
Combines the replicates of each reading before a term's aggregation.
"""
type ReplicateAggregation {
  aggregation: TermAggregation!

  """
  ISO 8601 duration a reading spans from its first record, e.g. PT5M or P1D.
  Null when the replicates of a reading have the same start and end.
  """
  window: String
}
