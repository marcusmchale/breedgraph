type Query {
    """Get own account details for administrative tasks"""
    accountsAccount: AccountPayload!
    """
    Get the user access map of access type to team
    """
    accountsUserAccess: UserAccessPayload!
    """
    The roots of the team trees, which every signed-in user sees.
    Teams below a root are visible to their affiliates only (docs/read-access.md, rule 9).
    Navigation of the team tree graph is achieved by resolvers on the parent/children attributes. Requires sign-in.
    """
    teamsRoots: TeamsPayload!
    """
    A team by id; a placeholder for a team hidden from the user.
    As with team trees, the team tree can be explored from this node. Requires sign-in.
    """
    teamsTeam(id: ID!): TeamPayload! # see team
    """
    Teams by id, as teamsTeam. Requires sign-in.
    """
    teamsTeams(ids: [ID!]): TeamsPayload! # see team
    """ What an invitation offers, for the registration form. Requires the token from the invitation link, not login """
    accountsInvitation(token: String!): InvitationPreviewPayload!
    """ Persons the user can see in full or by attribution, optionally by exact name (case insensitive). Requires sign-in """
    people(name: String): PeoplePayload!
    """ Get Persons by id, each in the user's view of it (Person.view). Requires sign-in """
    peoplePeople(ids: [ID!]!): PeoplePayload!
    """ Get a Person by id, in the user's view of it (Person.view). Requires sign-in """
    peoplePerson(id: ID!): PersonPayload!
    """ The Person linked to the current user's account, if any """
    peopleMyPerson: PersonPayload!
    """ The current user's pending requests to be linked to a Person """
    peopleMyClaims: PersonClaimsPayload!
    """ Pending requests to be linked to Persons controlled by teams the current user administers """
    peopleClaimRequests: PersonClaimRequestsPayload!
    """Get the latest ontology version"""
    ontologyVersion: VersionPayload!
    """
    Get the complete ontology at a given version for editing.
    Defaults to latest version with view PUBLISHED.
    Supports PUBLISHED and EDITORIAL views.
    """
    ontology(
        versionId: ID
        view: OntologyView = PUBLISHED
    ): OntologyPayload!
    """
    Get a list of ontology entries.
    Supports all views.
    Defaults to latest version with view PUBLISHED.
    """
    ontologyEntries(
    """
    Snapshot:
    """
        versionId: ID
        view: OntologyView = PUBLISHED
    """
    Filters (at least one is required)
    """
        ids: [ID!]
        labels:[OntologyNodeLabel!]
    ): OntologyEntriesPayload!
    """
    Get relationships for entries to update a retrieved ontology without refetching the whole ontology.
    Supports PUBLISHED and EDITORIAL views.
    Defaults to latest version with view PUBLISHED.
    """
    ontologyRelationships(
    """
    Snapshot
    """
        versionId: ID
        view: OntologyView = PUBLISHED
    """
    Filters
    """
        entryIds: [ID!]!
    ): OntologyRelationshipsPayload!
    """Get ontology commit history, use lastVersionId to paginate"""
    ontologyCommitHistory(limit: Int, lastVersionId: ID): OntologyCommitsPayload!
    """
    Get a list of users requesting new ontology roles.
    Only available to Users with the admin ontology role.
    """
    ontologyRoleRequests: UsersPayload!
    """
    Get a list of Ontology Editors
    Only available to Users with the admin ontology role.
    """
    ontologyEditors: UsersPayload!
    """
    Get a list of Ontology Admins
    Only available to Users with the admin ontology role.
    """
    ontologyAdmins: UsersPayload!
    """Get a list of country templates for use in top level location tree creation"""
    locationsCountries: LocationTemplatesPayload!
    """
    The locations the user can read whose name contains name, ignoring case, those whose name starts with it first,
    then by name: at most limit (10 by default, 50 at most)
    """
    locationsSearch(name: String!, limit: Int): LocationsPayload!
    """
    Places matching a search, to move the location map to: preferring those in viewbox ([west, south, east, north]),
    or only those there when bounded, and only those in the country with ISO alpha-2 countryCode when given.
    The server asks OpenStreetMap's Nominatim, so the browser contacts no third party. Requires sign-in, and is
    limited per user per hour.
    """
    locationsSearchPlaces(query: String!, viewbox: [Float!], bounded: Boolean, countryCode: String, limit: Int): PlacesPayload!
    """The country with this name, as locationsSearchPlaces finds places. Requires sign-in"""
    locationsGeocodeCountry(name: String!): PlacePayload!
    """
    Where the detailed maps of the country with this ISO 3166 alpha-3 code stand on this site (docs/maps.md): fetched
    in the background once the country is added, or for a country too large to fetch whole, by its sections as
    locations in them are placed on the map
    """
    locationsMapStatus(code: String!): CountryMapStatusPayload!
    """Get a list of location tree "root" locations.
    These are all countries that form the top-level location in the location tree.
    """
    locationsRoots: LocationsPayload!
    """ Get locations by locationId """
    locationsLocations (ids: [ID!]!): LocationsPayload!
    """ Search for locations by ontology Location type """
    locationsLocationsByType (locationTypeId: ID!): LocationsPayload!
    """
    Every readable location below the given locations, grouped by location type, as id and name.
    For selecting all the locations of a type at once.
    """
    locationsDescendantsByType (locationIds: [ID!]!): LocationTypeLocationsPayload!
    """
    Get a list of layout tree roots.
    These are all layouts that form the top-level layout in a layout tree.
    Optionally retrieve only those at a given location by supplying locationId.
    """
    layoutsRoots(locationId: ID!): LayoutsPayload!
    """ Get a layout details by ID """
    layoutsLayouts(ids: [ID!]): LayoutsPayload! # see team
    """
    Get a list of unit graph "root" units: the top-level units of the unit graphs, here those with a position of their
    own at these locations, at any time; with below, at them and at every location under them that you can read. None
    at a location you cannot read, and none under it unless it is a location tree's root.
    """
    unitsRoots(locationIds: [ID!], below: Boolean): UnitsPayload!
    """
    The arrivals at these locations: units, not unit graph roots, that came there together from elsewhere in their unit
    graphs (UnitArrival); newest first, undated last. With below, at them and at every location under them that you can
    read: an arrival is still at the location it came to (samples brought from a field to its farm's lab arrived at the
    lab). With unitId, only the units at, below or above it, e.g. where the samples of a tree went. None at a location
    you cannot read, and none under it unless it is a location tree's root.
    """
    unitsArrivals(locationIds: [ID!]!, unitId: ID, below: Boolean): UnitArrivalsPayload!
    """ A page of an arrival's units, by name: limit at most 1000 (default 100) """
    unitsArrivalUnits(arrival: ArrivalInput!, offset: Int, limit: Int): UnitsPayload!
    """ Get units by ID. """
    unitsUnits(ids: [ID!]): UnitsPayload!
    """
    Every readable unit below the given units, grouped by subject, as id and name.
    For selecting all the units of a subject at once, e.g. every tree of a field.
    """
    unitsDescendantsBySubject(unitIds: [ID!]!): SubjectUnitsPayload!
    """ Get a list of all programs """
    programs: ProgramsPayload!
    """Get a program by Id of program, trial or study """
    programsProgram(
        id: ID
        trialId: ID
        studyId: ID
    ) : ProgramPayload!
    """ Get trials by Id of trial or study """
    programsTrial(
        id: ID
        studyId: ID
    ): TrialPayload!
    """ Get study by study Id """
    programsStudy(id: ID!): StudyPayload!
    """ Filter datasets by study and/or concept Id, OR retrieve by array of dataset ids """
    datasets (
        ids: [ID!]
        studyIds: [ID!]
        conceptIds: [ID!]
    ): DatasetsPayload!
    """ Get dataset submission by key """
    datasetsSubmission(id: ID!): DatasetSubmissionPayload!
    """ Get a summary of datasets for a study """
    datasetsSummaries(studyId: ID!): DatasetSummariesPayload!
    """
    One level of the tree of units the given datasets have records for: the children of parentIds, or, without
    parentIds, the roots. The tree holds the recorded units, those the user cannot read as placeholders, and the
    readable units above them; each hangs from its nearest readable ancestor, and a hidden unit holds nothing below it.
    start and end narrow the records counted to those whose own period overlaps the window, as for Dataset.records.
    Datasets the user cannot read contribute nothing. For offering only the units that matter to the datasets when
    narrowing their records.
    """
    datasetsUnits(datasetIds: [ID!]!, parentIds: [ID!], start: DateTime, end: DateTime): DatasetsUnitsPayload!
    """
    Every unit the given datasets have records for, grouped by subject as id and name, narrowed like
    Dataset.records: unitIds to those units and everything below the readable ones, start and end to a time window.
    Units the user cannot read are placeholders in one group without a subject.
    For selecting all the recorded units of a subject at once, e.g. every measured tree of a field.
    """
    datasetsUnitsBySubject(datasetIds: [ID!]!, unitIds: [ID!], start: DateTime, end: DateTime): SubjectUnitsPayload!
    """
    Where analysis position grouping (PositionGroupingInput) could place the records of readable datasets: the
    locations of the location types at or above the positions of their recorded units and of the units above them,
    with the layouts of those positions and the axis names they give. For the analysis editor: which unit places a
    record, and when, are left to the analysis, so these are every place it could use. Only what the user can read
    is given.
    """
    datasetsPlaces(datasetIds: [ID!]!, locationTypeIds: [ID!]!): DatasetPlacesPayload!
    """ Get the controller data for access controlled entities """
    controlsControllers (
        entityLabel: ControlledModelLabel!
        entityIds: [ID!]!
    ): ControllersPayload!
    """
    How many entities of each label teams control, by release. Only for teams the user is an admin of: a request
    naming any other team is refused.
    """
    controlsControlledCounts(teamIds: [ID!]!): ControlledCountsPayload!
    """
    The entities of a label a team controls, at a release if given, ordered by id, a page at a time (limit defaults
    to 50). Only for a team the user is an admin of.
    """
    controlsControlledEntities(
        teamId: ID!
        label: ControlledModelLabel!
        release: ReadRelease
        offset: Int
        limit: Int
    ): ControlledItemsPayload!
    """
    The units a team controls, as a tree: without parentIds the roots of the unit graphs holding them, with parentIds
    the nearest units below each that the team controls or that hold units it controls. Only for a team the user is
    an admin of.
    """
    controlsControlledUnits(teamId: ID!, parentIds: [ID!]): ControlledUnitsPayload!
    """ Control transfers offered to or from teams the user is an admin of """
    controlsTransfers (
        statuses: [ControlTransferStatus!]
    ): ControlTransfersPayload!
    """ Get a control transfer offered to or from a team the user is an admin of """
    controlsTransfer (id: ID!): ControlTransferPayload!
    """Get a list of Germplasm entries"""
    germplasmEntries(
        ids: [ID!]
    ): GermplasmEntriesPayload!
    """
    The Germplasm entries you can read with one of the names, or a synonym, ignoring case and surrounding space: up to
    1000 names, e.g. to match the names typed or pasted into a table. Names are unique among germplasm, synonyms need
    not be.
    """
    germplasmEntriesNamed(
        names: [String!]!
    ): GermplasmEntriesPayload!
    """
        Get a list of Germplasm entries that have no sources defined,
        these should typically represent the Crop concept
    """
    germplasmCrops: GermplasmEntriesPayload!
    """ Get reference by reference ID """
    references(ids: [ID!]): ReferencesPayload!
    """ Get a users recently created/updated file references """
    referencesRecentFiles(referenceTypes:[ReferenceType!]): ReferencesPayload!
    """ Search for references by text in description. Also searches for filename, url and externalId where relevant. """
    referencesSearch(
        description: String!
        referenceTypes: [ReferenceType!]
    ): ReferencesPayload!
    """ Get file submission by fileId for progress and status updates """
    referencesFileSubmission(fileId: ID!): FileSubmissionPayload!
    """ Check the availability of a file for download"""
    referencesFileDownloadState(fileId: ID!): FileDownloadStatePayload!
    """ Get a token to download a file """
    referencesFileDownload(fileId: ID!): FileDownloadPayload!
    " Get analysis status and results "
    analysisSubmission(id: ID!): AnalysisSubmissionPayload!
    " Get the IDs of the user's analysis submissions that have not expired, most recently updated first "
    analysisRecentSubmissions: AnalysisSubmissionIdsPayload!

    """ The Terms of Use, and whether the request's user has accepted them: open before they are accepted """
    termsOfUse: TermsOfUsePayload!
    """ The privacy notice: open to everyone, before the Terms of Use are accepted too """
    privacyNotice: PrivacyNoticePayload!
}
