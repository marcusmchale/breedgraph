type GermplasmRelationship {
    source: GermplasmEntry
    sink: GermplasmEntry
    sourceType: GermplasmSourceType!
    description: String
}

type GermplasmEntry {
    id: ID!
    name: String!
    description: String
    synonyms: [String!]
    time: DateTime
    reproduction: Reproduction
    origin: Location
    """
    The unit it came from, for germplasm produced by the breeding recorded here, e.g. the plant a selection was made
    from: a placeholder when hidden from you
    """
    unit: Unit
    controlMethods: [ControlMethod!]
    references: [ReferenceInterface!]
    sources: [GermplasmRelationship!]
    sinks: [GermplasmRelationship!]
}