input TeamInput {
    """ Required name for the team """
    name: String!
    """ Optional full name for the team """
    fullname: String
    """ Optional parent team to extend an organisation"""
    parentId: ID
    """ Optional legal entity for a new organisation, i.e. without a parent """
    legalEntity: LegalEntityInput
}

input LegalEntityInput {
    legalName: String!
    """ A role address for requests about personal data, not an individual's """
    privacyContact: String!
    """ The version of the data processing terms shown and accepted, see organisationsDataProcessingTerms """
    termsVersion: String!
}

input TeamUpdate {
    id: ID!
    name: String
    fullname: String
}

extend type Mutation {
    organisationsCreateTeam(
        team: TeamInput!
    ): BooleanPayload!
    organisationsDeleteTeam(
        id: ID!
    ): BooleanPayload!
    organisationsUpdateTeam(
        team: TeamUpdate!
    ): BooleanPayload!
    """
    Declare the legal entity responsible for an organisation, accepting the current data processing terms.
    Only on the root team, by its admins. A new declaration replaces the current one, which is kept as history.
    """
    organisationsDeclareLegalEntity(
        teamId: ID!
        legalEntity: LegalEntityInput!
    ): BooleanPayload!
    """
    Withdraw the legal entity declared for an organisation, by admins of its root team.
    Refused while the organisation controls any Person, including erased Persons. The declaration is kept as history.
    """
    organisationsWithdrawLegalEntity(teamId: ID!): BooleanPayload!
}