input GeoCoordinateInput {
    """Latitude in degrees according to ISO 6709"""
    latitude: Float!
    """Longitude in degrees according to ISO 6709"""
    longitude: Float!
    """Meters above WGS84 reference ellipsoid"""
    altitude: Float
    """UncertaIDy in meters associated with these coordinates"""
    uncertainty: Float
    """Additional coordinate description"""
    description: String
}

input LocationInput {
    name: String!
    """ Optional code for location, e.g. zip-code """
    code: String
    description: String
    address: String
    coordinates: [GeoCoordinateInput]
    """ Ontology LocationType identifier """
    typeId: ID!
    """ A parent location, required unless a country (see countries) """
    parentId: ID
}

"""
Fields left out are unchanged; null, or an empty string, clears an optional one (all but name, typeId and parentId; a
country keeps its code)
"""
input LocationUpdate {
    id: ID!
    name: String
    fullname: String
    """ Optional code for location, e.g. zip-code """
    code: String
    description: String
    address: String
    coordinates: [GeoCoordinateInput]
    """ Ontology LocationType identifier """
    typeId: ID
    """ A parent location, required unless a country (see countries) """
    parentId: ID
}

extend type Mutation {
    locationsCreateLocation(
        location: LocationInput!
        controlTeamId: ID!
        release: ReadRelease
    ): BooleanPayload!,
    locationsUpdateLocation(
        location: LocationUpdate!
    ): BooleanPayload!,
    locationsDeleteLocation(
        id: ID!
    ): BooleanPayload!
}