input ControlledEntityInput {
    label: ControlledModelLabel!
    id: ID!
}

"""
Every entity of a label that a team controls, in place of listing them, for acting on many at once: at a release
when given, and for units only those at and below some units when given. The user must be an admin of the team.
"""
input ControlScopeInput {
    teamId: ID!
    label: ControlledModelLabel!
    """Only those at this release, as the team set it"""
    release: ReadRelease
    """Units only: these units and those below them"""
    belowUnitIds: [ID!]
}

input ControlTransferOffer {
    """Controlled models to transfer, or a scope. Each is transferred alone, not with other models in its aggregate"""
    entities: [ControlledEntityInput!]
    """In place of entities: everything a team controls of a label (at a release, below some units)"""
    scope: ControlScopeInput
    """Teams giving up control. The user must be an admin of each, and each must control every entity"""
    fromTeamIds: [ID!]!
    """The team offered control, e.g. the root of another team tree"""
    recipientTeamId: ID!
    """Keep control for the teams giving it, sharing control with the teams taking it"""
    keepFromTeams: Boolean
    """
    Only when the user is also an admin of the recipient team: the teams taking control.
    The transfer is then accepted immediately.
    """
    toTeamIds: [ID!]
    """Only with toTeamIds: the release level of the new controls. Defaults to PRIVATE"""
    release: ReadRelease
}

extend type Mutation {
    """
    Set the release of entities, for the teams controlling them that the user is an admin of: give entityLabel and
    entityIds, or a scope
    """
    controlsSetRelease(
        entityLabel: ControlledModelLabel
        entityIds: [ID!]
        scope: ControlScopeInput
        release: ReadRelease!
    ): BooleanPayload!
    """Offer control of controlled models to a recipient team"""
    controlsOfferTransfer(offer: ControlTransferOffer!): BooleanPayload!
    """
    Accept a transfer offered to a team the user is an admin of.
    toTeamIds must be the recipient team or teams below it, each administered by the user.
    """
    controlsAcceptTransfer(id: ID!, toTeamIds: [ID!]!, release: ReadRelease): BooleanPayload!
    """Reject a transfer offered to a team the user is an admin of"""
    controlsRejectTransfer(id: ID!): BooleanPayload!
    """Cancel a pending transfer offered from teams the user is an admin of"""
    controlsCancelTransfer(id: ID!): BooleanPayload!
    """
    End the control of teams the user is an admin of, where other teams also control the entities: give the
    entities, or a scope
    """
    controlsRenounceControl(entities: [ControlledEntityInput!], scope: ControlScopeInput, teamIds: [ID!]!): BooleanPayload!
}
