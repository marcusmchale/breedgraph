enum DataFormat {
    FASTA
    FASTQ
    ODGI
    HDF5
    CSV
    TSV
}

input LegalReferenceInput {
    description: String
    text: String!
    """ PLAIN when omitted """
    textFormat: TextFormat
}

"""
A legal reference given as a file: a .txt (UTF-8 text), .md (markdown) or .pdf (with text, not a scan), of at most
5 MB unless configured otherwise. Its text is read on upload, so a wrong file is refused at once
"""
input LegalFileReferenceInput {
    """ The file's name when omitted """
    description: String
    file: Upload!
}

input ExternalReferenceInput {
    description: String
    url: String!
    externalId: String
}

input ExternalDataReferenceInput {
    description: String
    url: String!
    externalId: String

    format: DataFormat!
    schema: String
    """ The Persons credited, with the roles they had; on update, replaces them all """
    contributions: [ContributionInput!]
}

input FileReferenceInput {
    description: String
    file: Upload!
    """ The Persons credited, with the roles they had; on update, replaces them all """
    contributions: [ContributionInput!]
}

input DataFileReferenceInput {
    description: String
    file: Upload!

    format: DataFormat!
    schema: String
    """ The Persons credited, with the roles they had; on update, replaces them all """
    contributions: [ContributionInput!]
}



"""
Fields left out are unchanged; null, or an empty string, clears description
"""
input LegalReferenceUpdate {
    id: ID!
    description: String
    """ Omitted or unchanged, the text stays as it is. New typed text replaces a file the reference was read from """
    text: String
    textFormat: TextFormat
}

"""
New text for a legal reference, read from a file as for LegalFileReferenceInput

Fields left out are unchanged; null, or an empty string, clears description
"""
input LegalFileReferenceUpdate {
    id: ID!
    description: String
    file: Upload!
}

"""
Fields left out are unchanged; null, or an empty string, clears description or externalId
"""
input ExternalReferenceUpdate {
    id: ID!
    description: String
    url: String!
    externalId: String
}

"""
Fields left out are unchanged; null, or an empty string, clears description, externalId or schema
"""
input ExternalDataReferenceUpdate {
    id: ID!
    description: String
    url: String!
    externalId: String

    format: DataFormat!
    schema: String
    """ The Persons credited, with the roles they had; on update, replaces them all """
    contributions: [ContributionInput!]
}

"""
Fields left out are unchanged; null, or an empty string, clears description
"""
input FileReferenceUpdate {
    id: ID!
    description: String
    file: Upload
    """ The Persons credited, with the roles they had; on update, replaces them all """
    contributions: [ContributionInput!]
}

"""
Fields left out are unchanged; null, or an empty string, clears description or schema
"""
input DataFileReferenceUpdate {
    id: ID!
    description: String
    file: Upload

    format: DataFormat!
    schema: String
    """ The Persons credited, with the roles they had; on update, replaces them all """
    contributions: [ContributionInput!]
}

extend type Mutation {
    referencesCreateLegal(
        reference: LegalReferenceInput!
        controlTeamId: ID!
        release: ReadRelease
    ): CreatedIdPayload!
    referencesCreateExternal(
        reference: ExternalReferenceInput!
        controlTeamId: ID!
        release: ReadRelease
    ): CreatedIdPayload!
    referencesCreateExternalData(
        reference: ExternalDataReferenceInput!
        controlTeamId: ID!
        release: ReadRelease
    ): CreatedIdPayload!

    """As for dataset submissions, creating a file is asynchronous and we are returned a key """
    referencesCreateFile(
        reference: FileReferenceInput
        controlTeamId: ID!
        release: ReadRelease
    ): FileIdPayload!
    referencesCreateDataFile(
        reference: DataFileReferenceInput
        controlTeamId: ID!
        release: ReadRelease
    ): FileIdPayload!
    """
    A legal reference with the text of a .txt, .md or .pdf file. Returns the key that follows the file's saving, as for
    referencesCreateFile; the reference and its text exist at once
    """
    referencesCreateLegalFile(
        reference: LegalFileReferenceInput!
        controlTeamId: ID!
        release: ReadRelease
    ): FileIdPayload!
    
    referencesUpdateLegal(reference: LegalReferenceUpdate!): BooleanPayload!
    """ New text from a file, applied with the file once it is saved; returns the key that follows the saving """
    referencesUpdateLegalFile(reference: LegalFileReferenceUpdate!): FileIdPayload!
    referencesUpdateExternal(reference: ExternalReferenceUpdate!): BooleanPayload!
    referencesUpdateExternalData(reference: ExternalDataReferenceUpdate!): BooleanPayload!

    referencesUpdateFile(reference: FileReferenceUpdate): FileIdPayload!
    referencesUpdateDataFile(reference: DataFileReferenceUpdate): FileIdPayload!
    
    referencesDelete(ids: [ID!]!): BooleanPayload!
    """ Request to make an archived file available for download """
    referencesRequestFileRetrieval(fileId: ID!): BooleanPayload!
}