input PositionInput {
    """
    ID of Location in a LocationTree
    """
    locationId: ID!
    """
    ID of Layout in and LayoutTree
    """
    layoutId: ID
    """
    Coordinates should be a list of values corresponding to the stored layout axes.
    """
    coordinates: [String]
    start: DateTime
    end: DateTime
}

""" An arrival: the units that came to a location from one start (UnitArrival) """
input ArrivalInput {
    locationId: ID!
    """ The start as entered, e.g. 2025-03 for an arrival of March 2025; null for the units there without one """
    start: DateTime
    """ Only the arrival's units at, below or above this unit, e.g. the samples of one tree """
    unitId: ID
}

""" Units whose positions change: by id, or an arrival's, those of its units you can read """
input UnitsSelection {
    unitIds: [ID!]
    arrival: ArrivalInput
}

"""
A position found by its value: the fields given must match as entered, a time with its precision, and those omitted
match any; null matches none, e.g. end: null for a position that has no end
"""
input PositionMatchInput {
    locationId: ID!
    layoutId: ID
    coordinates: [String]
    start: DateTime
    end: DateTime
}

""" What changes in a position: each field given replaces the value (null removes it), those omitted are kept """
input PositionChangeInput {
    locationId: ID
    layoutId: ID
    coordinates: [String]
    start: DateTime
    end: DateTime
}

input UnitInput {
    """
    ID of Subject in the ontology
    """
    subjectId: ID!
    germplasmId: ID

    name: String
    description: String
    """
    IDs of parent Units, of which this unit forms a component
    """
    parentIds: [ID]
    """
    IDs of child Units, which represent a component of this unit.
    """
    childrenIds: [ID]
    """
    The units its material came from, which pass nothing down, unlike parents: e.g. plantlets in a field grown from
    microcuttings that arrived from a lab. Each needs read access.
    """
    derivedFrom: [UnitDerivationInput!]
}

input UnitDerivationInput {
    """ The unit the material came from """
    unitId: ID!
    stage: DerivationStage = UNKNOWN
    """ e.g. the approximate stage of a plant, or how a graft was formed """
    description: String
}

"""
Fields left out are unchanged; null, or an empty string, clears name or description; null removes subjectId or
germplasmId
"""
input UnitUpdate {
    id: ID!
    """ Omitted, the subject is unchanged; null removes it """
    subjectId: ID
    """ Omitted, the germplasm is unchanged; null removes it """
    germplasmId: ID
    name: String
    description: String
    parentIds: [ID!]
    childrenIds: [ID!]
    """ Omitted, the units it is derived from are unchanged; an empty list removes them all """
    derivedFrom: [UnitDerivationInput!]
}

extend type Mutation {
    unitsCreateUnit(
        unit: UnitInput!
        controlTeamId: ID!
        release:ReadRelease
        position: PositionInput
    ): BooleanPayload!
    unitsUpdateUnit(unit: UnitUpdate!): BooleanPayload!
    unitsDeleteUnit(id: ID!): BooleanPayload!
    unitsAddPosition(
        id: ID!
        position: PositionInput!
    ): BooleanPayload!
    unitsRemovePosition(
        id: ID!
        position: PositionInput!
    ): BooleanPayload!
    """
    Moves the units to the position from its start, e.g. an arrival's samples on to another lab: each unit's own
    positions holding then end at that start (unless they end by then), and the position is added. Refused for a unit
    with a position from that start or later, and unless you curate every unit. Returns the units moved.
    """
    unitsMoveUnits(
        units: UnitsSelection!
        position: PositionInput!
    ): UnitsPayload!
    """
    Changes one position of each unit, the one matching at, e.g. to end an arrival there or correct its start: refused
    where a unit has none or several matching, unless you curate every unit. Returns the units changed.
    """
    unitsChangePositions(
        units: UnitsSelection!
        at: PositionMatchInput!
        change: PositionChangeInput!
    ): UnitsPayload!
    """
    Creates a unit derived from each of the units, e.g. plantlets in a field from the microcuttings of an arrival:
    each a child of parentIds (e.g. a field-season unit), or with no parents the root of a unit graph of its own at
    the position. Each takes its source's name and subject (or subjectId), and as its germplasm germplasmId if given,
    else with copyGermplasm the germplasm its source has or takes from the units above it, where you can read it,
    else none. Set them apart afterwards with unitsUpdateUnit, and the positions of each with unitsAddPosition. The
    units derived from are left as they are: end or move them with unitsChangePositions or unitsMoveUnits. Needs read
    access to every unit, and to the germplasm given. Returns the units created, in the order of the units they came
    from.
    """
    unitsDeriveUnits(
        units: UnitsSelection!
        parentIds: [ID!]
        position: PositionInput
        subjectId: ID
        stage: DerivationStage = UNKNOWN
        description: String
        germplasmId: ID
        copyGermplasm: Boolean = true
        controlTeamId: ID!
        release: ReadRelease
    ): UnitsPayload!
    """
    Adds count children (1 to 100) of the subject to each of the parents in one go, all or none, e.g. three leaf
    samples from each tree of a field on the day they were taken. Each is named from the template: {parent} is its
    parent's name (or its subject and id), {subject} the subject's name and {n} its number among its parent's new
    children, from 1, so the default names the first leaf of Tree 1 "Tree 1 - Leaf 1"; null leaves them unnamed. With
    more than one child to each parent, the name needs {n}. With a start, each child has a position at its parent's
    place then, its own or the one it takes from the units above it, from then: refused for a parent whose place then
    can't be told, its lineages differing or hidden. Without one, the children are where their parents are. Their
    germplasm is the one given, else what they take from their parents. Needs read access to every parent, and to the
    germplasm given. Returns the children, by parent in the order given.
    """
    unitsAddChildren(
        parents: UnitsSelection!
        subjectId: ID!
        count: Int = 1
        name: String = "{parent} - {subject} {n}"
        description: String
        germplasmId: ID
        start: DateTime
        controlTeamId: ID!
        release: ReadRelease
    ): UnitsPayload!
}
