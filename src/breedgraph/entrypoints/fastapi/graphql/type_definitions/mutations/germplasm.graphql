enum Reproduction {
    CLONAL
    SEXUAL
    APOMIXIS
}

enum GermplasmSourceType {
    UNKNOWN
    SEED
    TISSUE
    MATERNAL
    PATERNAL
}

input GermplasmSourceRelationship {
    sourceId: ID!
    sourceType: GermplasmSourceType!
    description: String
}

# Program Mutations
input GermplasmInput {
    name: String!
    description: String
    synonyms: [String!]

    """
    Place of origin, a reference to a Location stored in Location trees
    """
    originId: ID
    """
    Time sourced from origin
    """
    time: DateTime
    """
    The unit it came from, a reference to a Unit in a unit graph, for germplasm produced by the breeding recorded here:
    e.g. the plant a selection was made from, or the seed of a cross
    """
    unitId: ID
    """
    Reproduction of germplasm, summarises the genetic impacts/requirements for maintenance
    """
    reproduction: Reproduction
    """
    Control methods (referenced in the ontology) to provide further details about how this germplasm is maintained
    """
    controlMethodIds: [ID!]
    """References for ths germplasm entry (A list of referenceId)"""
    referenceIds: [ID!] = []
    """Source relationships"""
    sources: [GermplasmSourceRelationship!]
}

input GermplasmUpdate {
    id: ID!
    name: String
    description: String
    synonyms: [String!]
    """ Omitted, the origin is unchanged; null removes it """
    originId: ID
    time: DateTime
    """ Omitted, the unit is unchanged; null removes it """
    unitId: ID
    reproduction: Reproduction
    controlMethodIds: [ID!]
    referenceIds: [ID!]
    sources: [GermplasmSourceRelationship!]
}

extend type Mutation {
    germplasmCreateEntry(
        entry: GermplasmInput!
        controlTeamId: ID!
        release:ReadRelease
    ): BooleanPayload
    germplasmUpdateEntry(entry: GermplasmUpdate!): BooleanPayload
    germplasmDeleteEntry(id: ID!): BooleanPayload
}