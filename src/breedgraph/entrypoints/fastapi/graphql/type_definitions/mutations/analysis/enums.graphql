"""
Type of analysis to perform.
"""
enum AnalysisType {
  """
  Analysis of variance using a statistical model.
  """
  ANOVA

  """
  Multidimensional scaling.
  """
  MDS

  """
  Pairwise correlation analysis.
  """
  CORRELATION

  """
  Descriptive statistics.
  """
  DESCRIPTIVE_STATISTICS

  """
  Detection of observations that may be statistical outliers.
  """
  OUTLIER_DETECTION
}


"""
Defines how a term is represented for an analysis.
"""
enum TermRepresentationType {
  """
  Treat values as continuous numeric measurements.
  """
  CONTINUOUS

  """
  Treat values as nominal categorical values.
  """
  CATEGORICAL

  """
  Treat values as ordered categorical values.
  """
  ORDINAL
}


"""
Defines whether a model term is estimated as a fixed or random
effect.
"""
enum TermEffect {
  """
  Estimate the effect directly as a fixed effect.
  """
  FIXED

  """
  Estimate the effect as a random effect.
  """
  RANDOM
}


"""
Transformations that may be applied to term values before analysis.

Transformations are applied in the order in which they are provided.
"""
enum TermTransformation {
  """
  Centre values by subtracting their mean.
  """
  CENTER

  """
  Standardise values using their mean and standard deviation.
  """
  STANDARDIZE

  """
  Apply the natural logarithm.
  """
  LOG

  """
  Apply log(1 + x).
  """
  LOG1P

  """
  Apply the square-root transformation.
  """
  SQRT

  """
  Apply the reciprocal transformation.
  """
  RECIPROCAL
}


"""
Defines how multiple records contributing to an analytical
observation are aggregated.
"""
enum TermAggregation {
  """
  Do not aggregate values.

  The analysis requires at most one applicable value for
  each analytical observation.
  """
  NONE

  """
  Arithmetic mean.
  """
  MEAN

  """
  Median.
  """
  MEDIAN

  """
  Minimum value.
  """
  MIN

  """
  Maximum value.
  """
  MAX

  """
  Sum of values.
  """
  SUM

  """
  Number of applicable values.
  """
  COUNT

  """
  Most frequently occurring value.
  """
  MODE
}


"""
Type of term used by an analysis.

Each domain term type corresponds to a dimension of analytical
observation identity.
"""
enum AnalysisTermType {
  """
  A dataset concept.
  """
  CONCEPT

  """
  The time dimension. Requires grouping.time.
  """
  TIME

  """
  The germplasm dimension. Requires grouping.germplasm.
  """
  GERMPLASM

  """
  The observation unit: the base unit of each record, or its
  nearest unit of a subject when grouping.unit is configured.
  """
  UNIT

  """
  Where the units were: the nearest location of one of the location
  types of grouping.position. Requires grouping.position.
  """
  LOCATION

  """
  The values on a layout axis, identified by layoutAxis, nested in
  the layout that has the axis. Requires the axis in grouping.position.axes.
  """
  LAYOUT_AXIS

  """
  A record group dimension, identified by recordGroupDimension.
  Requires a matching dimension in grouping.recordGroups.
  """
  RECORD_GROUP

  """
  The study each record belongs to.

  Requires no configuration. When used, study becomes part of
  observation identity, so records of a unit in different studies
  form distinct observations.
  """
  STUDY

}

"""
Determines how records are assigned to time bins.
"""
enum TimeAssignment {
  """
  Assign a record according to the start of its period: the start of the period of its start time.

  If no start is found for the record, use its end time: a record ending 2021-05-03 starts that day.
  """
  START

  """
  Assign a record according to the end of its period: the last moment of the period of its end time,
  so a record ending 2021-05-03 is assigned to the end of that day.

  If no end is found for the record, use the end of the period of its start time.
  """
  END

  """
  Assign the observation to the bin containing the midpoint of its period, from the start of the
  period of its start time to the end of the period of its end time.

  A record with only one time takes the midpoint of that time's period: a record of 2021 has its
  midpoint in July.
  """
  MIDPOINT
}


"""
Determines which side of a bin boundary receives a value equal
to the boundary.
"""
enum BinningBoundary {
  """
  A value equal to the boundary is assigned to the bin on the
  lower-value side of the boundary.
  """
  LEFT

  """
  A value equal to the boundary is assigned to the bin on the
  higher-value side of the boundary.
  """
  RIGHT
}


"""
Distance metric used to calculate dissimilarities for MDS.
"""
enum DistanceMetric {
  EUCLIDEAN

  MANHATTAN

  MINKOWSKI
}


"""
Correlation method used to calculate a correlation matrix.
"""
enum CorrelationMethod {
  PEARSON

  SPEARMAN

  KENDALL
}


"""
Method used to detect potential outliers.
"""
enum OutlierDetectionMethod {
  Z_SCORE

  IQR

  MAHALANOBIS
}

"""
Clustering methods supported for MDS observations.
"""
enum ClusteringMethod {
  KMEANS
  HIERARCHICAL
}


"""
Type of sums of squares used for ANOVA tables.
"""
enum SumOfSquaresType {
  TYPE_II

  """
  Uses sum-to-zero contrasts.
  """
  TYPE_III
}


"""
Method for denominator degrees of freedom in mixed models.
"""
enum DdfMethod {
  SATTERTHWAITE
  KENWARD_ROGER
}


"""
Contrasts between estimated marginal means.
"""
enum EstimatedMeansContrast {
  """
  All pairwise comparisons.
  """
  PAIRWISE

  """
  Comparisons of each level against a control level.
  """
  TRT_VS_CTRL

  """
  Means only.
  """
  NONE
}


"""
Adjustment of p values for multiple comparisons.
"""
enum PValueAdjustment {
  TUKEY
  BONFERRONI
  HOLM
  SIDAK
  NONE
}
