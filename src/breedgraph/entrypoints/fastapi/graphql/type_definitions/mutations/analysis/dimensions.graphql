"""
Defines how record start/end time is used to construct a time
grouping dimension.

This configuration concerns the temporal metadata associated
with records. It does not describe concepts whose values happen
to represent dates, times or durations.
"""
input TimeSpecificationInput {
  """
  Determines how records are assigned to time bins.

  If time assignment is provided and a record has no applicable
  time information, the record is excluded from the analysis.
  """
  assignment: TimeAssignment!

  """
  Defines the time bins used to construct the grouping dimension.
  """
  binning: BinningInput!
}

"""
Defines how germplasm is resolved into analytical groups.

The server navigates the germplasm hierarchy from the germplasm
assigned to each unit to find the applicable selected ancestor.
"""
input GermplasmGroupingInput {
  """
  Germplasm IDs defining the grouping level.

  Descendant germplasm is assigned to the corresponding selected
  ancestor while preserving the hierarchy of the grouping.
  """
  germplasmIds: [ID!]!
}

"""
Defines how units are resolved into analytical groups.

The server navigates the unit hierarchy from each record's unit
to find the applicable selected parent unit.
"""
input UnitGroupingInput {
  """
  Parent unit IDs defining the grouping level.

  Descendant units are assigned to the corresponding selected
  parent unit.
  """
  unitIds: [ID!]!
}

"""
Defines how positions are resolved into analytical groups.

Positions may represent geographic locations, layout coordinates,
or both.
"""
input PositionGroupingInput {
  """
  ID of the Location in the Region hierarchy.
  """
  locationId: ID!

  """
  Optional ID of the Layout in the Arrangement hierarchy.
  """
  layoutId: ID

  """
  Layout axes used to define position groups.

  Positions having equal values for all selected axes belong
  to the same group.
  """
  axisIndexes: [Int!]

  """
  Optional explicit positions defining groups. This overrides axisIndexes where the position match is found.
  """
  positions: [PositionInput!]

  """
  Time at which the position is evaluated.

  When null, a unit is considered to match the defined position
  if it occupied that position at any time.
  """
  time: DateTime
}

"""
A code of a record grouping.
"""
input RecordGroupMemberInput {
  """
  ID of the record grouping.
  """
  groupingId: ID!

  """
  Record group code within the grouping.
  """
  code: String!

  """
  A selected dataset in the scope the code belongs to.

  Required for dataset-scoped groupings, where equal codes in
  different scopes are distinct levels. Must not be provided for
  study-wide groupings.
  """
  datasetId: ID
}


"""
Defines a level shared by codes from one or more record groupings.

Use this when codes from different groupings or scopes represent
the same thing, e.g. a processing batch that included samples
from several studies.
"""
input RecordGroupLevelInput {
  """
  Label of the level in analysis results.

  Unique within the dimension. Must not contain "|".
  """
  label: String!

  """
  Codes that belong to this level. Each code may belong to only one level.
  """
  members: [RecordGroupMemberInput!]!
}


"""
Defines a record group dimension, which may span studies.

Levels are nested by default: each code is a distinct level within
its grouping and scope, so equal codes from different studies or
scopes are never pooled. Level definitions explicitly combine codes
into shared levels; codes not included in a level definition keep
their nested identity.

Records with no code for any of the dimension's groupings, including
all records from studies without such a grouping, are excluded from
the analysis and reported in a warning.
"""
input RecordGroupDimensionInput {
  """
  Name of the dimension, unique within the analysis.

  Referenced by AnalysisTermReferenceInput.recordGroupDimension
  and used as the label of the dimension in results.
  """
  name: String!

  """
  Record groupings contributing to the dimension.

  Each grouping must belong to the study of a selected dataset.
  At most one grouping per study, and each grouping may contribute
  to only one dimension in the analysis.
  """
  groupingIds: [ID!]!

  """
  Optional shared levels combining codes across groupings or scopes.
  """
  levels: [RecordGroupLevelInput!]
}


"""
Defines the dimensions used to construct analytical observations.

The observation unit is always part of observation identity: the
base unit of each record, or its parent unit when a unit grouping
is configured. Each configured dimension also contributes to
observation identity. Study contributes only when a STUDY term
is used.

Records that cannot be assigned to a configured dimension are
excluded from the analysis and reported in a warning.
"""
input AnalysisGroupingInput {
  """
  Groups records according to their record start/end time.
  """
  time: TimeSpecificationInput

  """
  Groups units according to germplasm hierarchy.
  """
  germplasm: GermplasmGroupingInput

  """
  Replaces the base unit with a selected parent unit.
  """
  unit: UnitGroupingInput

  """
  Groups records according to geographic or layout position.
  """
  position: PositionGroupingInput

  """
  Groups records according to study record groupings, e.g. batch or replicate.
  """
  recordGroups: [RecordGroupDimensionInput!]
}