"""
Defines an analysis to be submitted for execution.

Analysis configurations are validated by the server according
to analysisType.
"""
input AnalysisInput {
  """
  Type of analysis to perform.
  """
  analysisType: AnalysisType!

  """
  Optional name for the analysis.
  """
  name: String

  """
  Datasets whose records are included in the analysis.
  """
  datasetIds: [ID!]!

  """
  Records or units excluded from the analysis.

  Unit exclusions apply across all datasets included in the analysis.
  """
  exclusions: AnalysisExclusionInput

  """
  ANOVA configuration.
  """
  anova: AnovaInput

  """
  MDS configuration.
  """
  mds: MDSInput

  """
  Correlation configuration.
  """
  correlation: CorrelationInput

  """
  Descriptive statistics configuration.
  """
  descriptiveStatistics: DescriptiveStatisticsInput

  """
  Outlier detection configuration.
  """
  outlierDetection: OutlierDetectionInput
}

"""
Specifies a datetime range for exclusion.

Open-ended ranges are supported:
- If start is null, the range extends from the beginning of time
- If end is null, the range extends to the end of time

A record is excluded if it overlaps with ANY exclusion range,
where overlap is defined as: record.start < range.end AND record.end > range.start
(using null comparisons: null is treated as unbounded)
"""
input DatetimeRangeInput {
  """
  Inclusive start of the exclusion range (ISO 8601 format).
  Null means unbounded start.
  """
  start: DateTime

  """
  Exclusive end of the exclusion range (ISO 8601 format).
  Null means unbounded end.
  """
  end: DateTime
}


"""
Defines records or units to exclude from an analysis.

A unit exclusion applies to records from that unit across
all datasets included in the analysis.
"""
input AnalysisExclusionInput {
  """
  IDs of units to exclude.

  All records associated with an excluded unit are excluded.
  """
  unitIds: [ID!]

  """
  IDs of records to exclude.
  """
  recordIds: [ID!]

  """
  Datetime ranges for record exclusion.

  Records with optional start/end timestamps are excluded if they
  overlap with any of these ranges.
  """
  datetimeRanges: [DatetimeRangeInput!]
}