"""
Configuration for descriptive statistics.
"""
input DescriptiveStatisticsInput {
  """
  Terms for which descriptive statistics are calculated.
  """
  terms: [AnalysisTermInput!]!

  """
  Dimensions used to construct analytical observations.
  """
  grouping: AnalysisGroupingInput

  """
  Optional interactions between analysis terms when model-dependent
  statistics are requested.
  """
  interactions: [InteractionTermInput!]

  """
  Optional estimated marginal means (least-squares means).
  """
  estimatedMeans: [EstimatedMeansInput!]
}
