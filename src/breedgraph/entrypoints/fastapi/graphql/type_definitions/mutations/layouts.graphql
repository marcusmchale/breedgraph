input LayoutInput {
    """ Location ID from LocationTree, provide this only for the root layout in a layout tree """
    locationId: ID
    """ Ontology LayoutType identifier """
    typeId: ID!
    """ Axis labels """
    axes: [String!]
    """ Optional name for the layout """
    name: String
    """ Optional parent layout to construct multiplexed layout layout trees"""
    parentId: ID
    """ When parent is supplied, position according to parent layout axes must be provided."""
    position: [String]
}

input LayoutUpdate {
    id: ID
    """ Location ID from LocationTree, provide this only for the root layout in a layout tree """
    locationId: ID
    typeId: ID
    axes: [String!]
    name: String
    parentId: ID
    position: [String]
}

extend type Mutation {
    layoutsCreateLayout(
        layout: LayoutInput!
        controlTeamId: ID!
        release:ReadRelease
    ): BooleanPayload!
    layoutsUpdateLayout(
        layout: LayoutUpdate!
    ): BooleanPayload!
    layoutsDeleteLayout(
        id: ID!
    ): BooleanPayload!
}