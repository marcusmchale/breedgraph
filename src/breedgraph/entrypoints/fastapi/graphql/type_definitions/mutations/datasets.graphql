input RecordGroupInput {
    id: ID!
    code: String!
}

input RecordInput {
    unitId: ID!
    value: String
    start: DateTime
    end: DateTime
    groups: [RecordGroupInput!]
    referenceIds: [ID]
}

"""
A record's changes: a field not given is left as it is
"""
input RecordUpdate {
    id: ID!
    unitId: ID
    value: String
    """ Given as null, the record's start is removed """
    start: DateTime
    """ Given as null, the record's end is removed """
    end: DateTime
    groups: [RecordGroupInput!]
    referenceIds: [ID]
}

input DatasetInput {
    studyId: ID!
    """ concept is either a Factor or Variable in the ontology """
    conceptId: ID!
    records: [RecordInput!]!
    contributions: [ContributionInput!]
    referenceIds: [ID!]
}

input DatasetUpdate {
    """
    Optionally provide a list of records to update
    """
    id: ID!
    studyId: ID
    conceptId: ID
    records: [RecordUpdate!]!
    contributions: [ContributionInput!]
    referenceIds: [ID!]
}

extend type Mutation {
    """
    Submission Payloads include a key, the data is processed asynchronously
    Poll the datasetsSubmission using the returned submission ID for status reports.
    """
    datasetsCreate(
        dataset: DatasetInput!
        controlTeamId: ID!
        release:ReadRelease
    ): SubmissionIdPayload!
    datasetsUpdate(
        dataset: DatasetUpdate!
    ): SubmissionIdPayload!
    datasetsAddRecords(
        id: ID!,
        records: [RecordInput!]
    ): SubmissionIdPayload!
    """Delete records from a dataset"""
    datasetsRemoveRecords(id: ID!, recordIds: [ID!]!): BooleanPayload!
}
