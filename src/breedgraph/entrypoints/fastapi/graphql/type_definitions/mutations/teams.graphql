input TeamInput {
    """ Required name for the team """
    name: String!
    """ Optional full name for the team """
    fullname: String
    """ Optional parent team to extend a team tree"""
    parentId: ID
}

"""
Fields left out are unchanged; null, or an empty string, clears fullname
"""
input TeamUpdate {
    id: ID!
    name: String
    fullname: String
}

extend type Mutation {
    teamsCreateTeam(
        team: TeamInput!
    ): BooleanPayload!
    teamsDeleteTeam(
        id: ID!
    ): BooleanPayload!
    teamsUpdateTeam(
        team: TeamUpdate!
    ): BooleanPayload!
}