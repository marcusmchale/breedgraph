extend type Mutation {
    """
    Register. Except for the first account, requires the token from an invitation link,
    and the email address must be the one invited.
    """
    accountsCreateAccount(
        name: String!
        fullname: String
        email: String!
        password: String!
        invitationToken: String
        """ Affiliations offered with the invitation to accept. Others are declined """
        acceptTeamIds: [ID!]
    ): BooleanPayload!
    accountsUpdateUser(
        name: String,
        fullname: String,
        email: String,
        password: String
    ): BooleanPayload!,
    accountsVerifyEmail(token: String!): BooleanPayload!
    accountsRequestPasswordReset(email:String!): BooleanPayload
    accountsResetPassword(token: String!, password: String!): BooleanPayload!
    accountsLogin(
        username: String!
        password: String!
    ): BooleanPayload!
    accountsLogout: BooleanPayload!,
    """
    Invite someone to register. Teams must be administered by the inviting user,
    and a Person must be controlled by a team they administer.
    """
    accountsInvite(
        email: String!
        teams: [TeamInvitationInput!]
        personId: ID
    ): BooleanPayload!
    accountsCancelInvitation(id: ID!): BooleanPayload!
    """ Send the invitation again, extending its expiry """
    accountsResendInvitation(id: ID!): BooleanPayload!
    accountsRequestAffiliation(
        teamId: ID!
        access: Access!
        heritable: Boolean
    ): BooleanPayload!
    accountsApproveAffiliation(
        userId: ID!
        teamId: ID!
        access: Access!
        heritable: Boolean
    ): BooleanPayload!
    accountsRemoveAffiliation(
        teamId: ID!
        access: Access!
    ): BooleanPayload!
    accountsRevokeAffiliation(
        userId: ID!
        teamId: ID!
        access: Access!
    ): BooleanPayload!
    accountsRequestOntologyRole(
        ontologyRole: OntologyRole!
    ): BooleanPayload!
    accountsSetOntologyRole(
        userId: ID!
        ontologyRole: OntologyRole!
    ): BooleanPayload!
    accountsSetWriteTeam(
        """ Set the default write team to ensure this team comes first in the write teams list """
        teamId: ID!
    ): BooleanPayload!
}

input TeamInvitationInput {
    teamId: ID!
    access: Access!
}
