extend type Mutation {
    """
    Register, with the token from an invitation link, and the email address invited. The site's first account, which
    invites the others, is made on the server (scripts/create_first_account.py).
    """
    accountsCreateAccount(
        name: String!
        fullname: String
        email: String!
        password: String!
        """ Consent to the processing of the user's personal data as the BreedGraph privacy notice describes. Required to be true """
        privacyConsent: Boolean!
        invitationToken: String
        """ Teams offered with the invitation to accept, with every access offered to each. Others are declined """
        acceptTeamIds: [ID!]
        """
        Link the Person offered with the invitation to the new account.
        Before the user confirms, tell them that other users may message them through BreedGraph
        if the Person is listed as a contact, at their account email address, which senders never see.
        They can remove themselves as a contact, and unlink or erase the Person, at any time.
        """
        linkPerson: Boolean
    ): BooleanPayload!
    """
    Change the user's own details. A new password ends their sign-ins elsewhere, and signs this browser in again; a new
    email address is set once its verification link is followed.
    """
    accountsUpdateUser(
        name: String,
        fullname: String,
        email: String,
        password: String
        """ The user's current password, required to change their password or email address. Failures count towards the login lockout """
        currentPassword: String
    ): BooleanPayload!,
    accountsVerifyEmail(token: String!): BooleanPayload!
    accountsRequestPasswordReset(email:String!): BooleanPayload
    accountsResetPassword(token: String!, password: String!): BooleanPayload!
    accountsLogin(
        username: String!
        password: String!
    ): BooleanPayload!
    accountsLogout: BooleanPayload!,
    """
    Delete your own account, confirming with your password, and log out.
    Your contributions stay attributed to an anonymous user id.
    Refused while you are the only ontology admin or the only admin of a team.
    Before the user confirms, ask whether to erase their linked Person as well, with erasing as the default.
    """
    accountsDeleteAccount(
        password: String!
        """ Erase the linked Person (the default), otherwise only unlink it """
        erasePerson: Boolean = true
    ): BooleanPayload!
    """
    Invite someone to register. Teams must be administered by the inviting user, who can offer one or more
    accesses to each, and a Person must be controlled by a team they administer.
    """
    accountsInvite(
        email: String!
        teams: [TeamInvitationInput!]
        personId: ID
    ): BooleanPayload!
    accountsCancelInvitation(id: ID!): BooleanPayload!
    """ Send the invitation again, extending its expiry """
    accountsResendInvitation(id: ID!): BooleanPayload!
    """
    Ask a team's admins for an affiliation, heritable by default. With an authorised affiliation to the team only,
    ask for it to be made heritable: it stays as it is until they decide. An admin's own request is authorised at once,
    unless it is heritable and they are not an admin for every team below.
    """
    accountsRequestAffiliation(
        teamId: ID!
        access: Access!
        heritable: Boolean
    ): BooleanPayload!
    """
    Authorise a user's affiliation to a team the user administers, heritable only by an admin for every team below.
    Authorising an affiliation the user holds to the team only answers their request to make it heritable with no.
    """
    accountsApproveAffiliation(
        userId: ID!
        teamId: ID!
        access: Access!
        heritable: Boolean
    ): BooleanPayload!
    accountsRemoveAffiliation(
        teamId: ID!
        access: Access!
    ): BooleanPayload!
    """
    Limit the user's own affiliation to the team, with no approval needed, or withdraw their request to make it
    heritable. Refused for read access while curate or admin access is heritable, and for the last heritable admin of a
    team tree's root.
    """
    accountsRemoveHeritability(
        teamId: ID!
        access: Access!
    ): BooleanPayload!
    accountsRevokeAffiliation(
        userId: ID!
        teamId: ID!
        access: Access!
    ): BooleanPayload!
    accountsRequestOntologyRole(
        ontologyRole: OntologyRole!
    ): BooleanPayload!
    accountsSetOntologyRole(
        userId: ID!
        ontologyRole: OntologyRole!
    ): BooleanPayload!
    accountsSetWriteTeam(
        """ Set the default write team to ensure this team comes first in the write teams list """
        teamId: ID!
    ): BooleanPayload!
}

input TeamInvitationInput {
    teamId: ID!
    access: Access!
}
