input PersonInput {
    name: String!
    fullname: String
}

input PersonUpdate {
    id: ID!
    name: String
    fullname: String
}

extend type Mutation {
    peopleCreatePerson(
        person: PersonInput!
        controlTeamId: ID!
        release:ReadRelease
    ): BooleanPayload!,
    peopleUpdatePerson(
        person: PersonUpdate!
    ): BooleanPayload!,
    peopleDeletePerson(
        id: ID!
    ): BooleanPayload!
}