enum VersionChange {MAJOR, MINOR, PATCH}

input TermInput {
    name: String!
    description: String
    abbreviation: String
    synonyms: [String!]
    """References for additional details, (Reference ID) e.g. a link to another ontology."""
    referenceIds: [ID!]
    sourceUrl: String
    sourceAttribution: String
    """
    To establish a hierarchy and relationships among terms.
    Parents or children may be defined for any entry.
    """
    parentIds: [ID!]
    childIds: [ID!]
    subjectIds: [ID!]
    scaleIds: [ID!]
    observationMethodIds: [ID!]
    traitIds: [ID!]
    variableIds: [ID!]
    controlMethodIds: [ID!]
    conditionIds: [ID!]
    factorIds: [ID!]
    eventIds: [ID!]
    locationTypeIds: [ID!]
    layoutTypeIds: [ID!]
    designIds: [ID!]
    roleIds: [ID!]
    recordGroupTypeIds: [ID!]
}

