enum VersionChange {MAJOR, MINOR, PATCH}

input TermInput {
    name: String!
    description: String
    abbreviation: String
    synonyms: [String!]
    """People that established this entry (Person ID)"""
    authorIds: [ID!]
    """References for additional details, (Reference ID) e.g. a link to another ontology."""
    referenceIds: [ID!]
    """
    To establish a hierarchy and relationships among terms.
    Parents or children may be defined for any entry.
    """
    parentIds: [ID!]
    childIds: [ID!]
    subjectIds: [ID!]
    scaleIds: [ID!]
    categoryIds: [ID!]
    observationMethodIds: [ID!]
    traitIds: [ID!]
    variableIds: [ID!]
    controlMethodIds: [ID!]
    conditionIds: [ID!]
    factorIds: [ID!]
    eventIds: [ID!]
    locationTypeIds: [ID!]
    layoutTypeIDs: [ID!]
    designIds: [ID!]
    roleIds: [ID!]
    titleIds: [ID!]
}

input SubjectInput {
    name: String!
    description: String
    abbreviation: String
    synonyms: [String!]
    authorIds: [ID!]
    referenceIds: [ID!]
    parentIds: [ID!]
    childIds: [ID!]
    termIds: [ID!]
    traitIds: [ID!]
    conditionIds: [ID!]
}

input TraitInput {
    name: String!
