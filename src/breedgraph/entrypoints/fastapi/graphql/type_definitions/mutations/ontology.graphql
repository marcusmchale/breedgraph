    referenceIds: [ID!]
    parentIds: [ID!]
    childIds: [ID!]
    termIds: [ID!]
    scaleType: ScaleType!
    """
    When defining a scale using existing categories, their identifiers may be listed in their proposed rank order.
    """
    categoryIds: [ID!]
}

input CategoryInput {
    name: String!
    description: String
    abbreviation: String
    synonyms: [String!]
    authorIds: [ID!]
    referenceIds: [ID!]
    parentIds: [ID!]
    childIds: [ID!]
    termIds: [ID!]
    """
    When creating a category for an ordinal scale, a rank should be provided.
    """
    rank: Int
}

