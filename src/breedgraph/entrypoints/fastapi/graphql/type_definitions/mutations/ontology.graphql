"""
Fields left out are unchanged; null, or an empty string, clears abbreviation, description, sourceUrl or
sourceAttribution, and null or an empty list clears synonyms (a locked entry refuses it).
Categories given replace the scale's, in order, and null or an empty list clears them. A locked scale refuses a change,
and the scale must keep every category records cite: categories can be added, reordered and described, but a name
records hold can't be removed or renamed.
"""
input ScaleUpdate {
    id: ID!
    name: String
    description: String
    abbreviation: String
    synonyms: [String!]
    referenceIds: [ID!]
    sourceUrl: String
    sourceAttribution: String
    parentIds: [ID!]
    childIds: [ID!]
    termIds: [ID!]

    scaleType: ScaleType!
    categories: [ScaleCategoryInput!]
}

