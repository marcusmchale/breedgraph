[pytest]
addopts = --strict-markers
markers =
    asyncio
env =
    DATABASE_NAME=neo4j
    MAIL_HOST=localhost
    MAIL_PORT=1025
    MAIL_USE_TLS=0
    ANALYSIS_WORKER_AUTH_TOKEN=test_analysis_worker_token
    MAP_WORKER_AUTH_TOKEN=test_map_worker_token
    MAP_PMTILES_COMMAND=
    GEONAMES_URL=
log_level = DEBUG