# /etc/nginx/sites-available/breedgraph-demo: the demonstration site, BreedView's demonstration build and the API from
# one origin, as production serves them (README.md, Nginx), beside production's server block on the same address:
# nginx tells them apart by name. Search engines are asked to leave it out.
server {
    listen 443 ssl;
    server_name demo.breedgraph.universityofgalway.ie;
    # the site's own certificate, got before this file is enabled, as nginx refuses a 443 block without one
    # (README.md here, Setting it up): certbot's, or the files of one issued for this name
    ssl_certificate /etc/letsencrypt/live/demo.breedgraph.universityofgalway.ie/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.breedgraph.universityofgalway.ie/privkey.pem;

    client_max_body_size 100M;
    add_header X-Robots-Tag "noindex, nofollow" always;

    root /var/www/breedgraph-demo;
    index index.html;

    # BreedView's routes, such as /guide/joining, load index.html, so that deep links survive a reload
    location / {
        try_files $uri $uri/ /index.html;
    }

    # the guide's captions, which browsers play only as text/vtt (a types block here would replace every other type)
    location ~ ^/guide-media/.*\.vtt$ {
        types { }
        default_type text/vtt;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # the guide's videos, answered in ranges as they are played
    location /guide-media/ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # the API's public routes; its worker, archive and retention routes are reached on 127.0.0.1 only
    location ~ ^/(graphql|csrf|download|verify|reset)$ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # map tiles, straight from the site's MAP_TILES_PATH
    location = /tiles/tiles.json {
        alias /opt/breedgraph-demo/map_tiles/tiles.json;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location /tiles/ {
        alias /opt/breedgraph-demo/map_tiles/;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}

# plain HTTP only redirects: every cookie the API sets is Secure, so the site cannot work without HTTPS
server {
    listen 80;
    server_name demo.breedgraph.universityofgalway.ie;
    return 301 https://$host$request_uri;
}
