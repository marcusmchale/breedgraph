# /etc/nginx/snippets/breedgraph-demo.conf: the demonstration site at /demo/ on production's host, included in
# production's server block for port 443 (include snippets/breedgraph-demo.conf;), so it shares its name and
# certificate. BreedView's demonstration build is built for /demo/ (VITE_BASE_PATH) and copied to /var/www/demo; the
# API, on 127.0.0.1:8001, is sent its requests without /demo, as its SITE_PATH says it is served (README.md here, The
# address). Everything is inside one ^~ location, so production's regular-expression locations, such as one caching
# .js files from its own root, never take the demonstration site's. Search engines are asked to leave it out.

location = /demo {
    return 301 /demo/;
}

location ^~ /demo/ {
    root /var/www;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # the site's upload limit, below production's: BreedView says a larger file is larger than the server accepts
    client_max_body_size 10m;

    # BreedView's routes, such as /demo/guide/joining, load its index.html, so that deep links survive a reload
    try_files $uri $uri/ /demo/index.html;
    # the site's page, checked on every load so that a new build is used at once; the files it names, renamed with each
    # build, kept a year
    location = /demo/index.html {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ^~ /demo/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # the API's public routes, without /demo; its archive, analysis and retention routes are reached on 127.0.0.1 only,
    # and its map worker's through the web server's internal port (docs/deployment.md, nginx)
    location ~ ^/demo/(graphql|csrf|download|verify|reset)$ {
        proxy_pass http://127.0.0.1:8001/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Where only HTTPS is open between the two networks (docs/deployment.md, nginx), the site's map worker on the worker
    # server comes here instead of to the internal port: uncomment, with that server's address
    #location ^~ /demo/map_jobs/ {
    #    allow <worker server's internal address>;
    #    deny all;
    #    proxy_pass http://127.0.0.1:8001/map_jobs/;
    #    proxy_http_version 1.1;
    #    proxy_set_header Host $host;
    #    client_max_body_size 0;
    #    proxy_request_buffering off;
    #    proxy_buffering off;
    #    proxy_read_timeout 300s;
    #    access_log off;
    #}

    # map tiles, straight from the site's MAP_TILES_PATH, whose world file is a link to production's
    location = /demo/tiles/tiles.json {
        alias /opt/breedgraph-demo/map_tiles/tiles.json;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ^~ /demo/tiles/ {
        alias /opt/breedgraph-demo/map_tiles/;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # the guide's videos, answered in ranges as they are played, and its captions, which browsers play only as text/vtt
    # (a types block here would replace every other type)
    location ^~ /demo/guide-media/ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Robots-Tag "noindex, nofollow" always;
        location ~ \.vtt$ {
            types { }
            default_type text/vtt;
            add_header X-Robots-Tag "noindex, nofollow" always;
        }
    }
}
