# /opt/breedgraph-demo/neo4j/conf/neo4j.conf: the demonstration site's Neo4j, a second instance of the installed package
# (Community runs one database an instance), with directories and ports of its own and authentication on. As
# scripts/scratch_services.sh configures its throwaway instances; the same Neo4j version as the machine the demo dump
# was built on. Copy server-logs.xml and user-logs.xml from /etc/neo4j beside it.
db.query.default_language=CYPHER_25
server.directories.data=/opt/breedgraph-demo/neo4j/data
server.directories.plugins=/var/lib/neo4j/plugins
server.directories.logs=/opt/breedgraph-demo/neo4j/logs
server.directories.lib=/usr/share/neo4j/lib
server.directories.run=/opt/breedgraph-demo/neo4j/run
server.directories.import=/opt/breedgraph-demo/neo4j/import
server.logs.config=/opt/breedgraph-demo/neo4j/conf/server-logs.xml
server.logs.user.config=/opt/breedgraph-demo/neo4j/conf/user-logs.xml

# beside production's 7687 and 7474, on the loopback interface only
server.default_listen_address=127.0.0.1
server.bolt.enabled=true
server.bolt.listen_address=127.0.0.1:7688
server.bolt.advertised_address=127.0.0.1:7688
server.http.enabled=true
server.http.listen_address=127.0.0.1:7475
server.https.enabled=false

dbms.security.auth_enabled=true
dbms.security.procedures.allowlist=apoc.coll.*

# a small database (its dump is under 1 MB), beside production's: little memory
server.memory.heap.initial_size=512m
server.memory.heap.max_size=1g
server.memory.pagecache.size=256m
server.jvm.additional=-XX:+UseG1GC
server.jvm.additional=--add-opens=java.base/java.nio=ALL-UNNAMED
server.jvm.additional=--add-opens=java.base/java.io=ALL-UNNAMED
server.jvm.additional=--add-opens=java.base/sun.nio.ch=ALL-UNNAMED
server.jvm.additional=--add-opens=java.base/java.util.concurrent=ALL-UNNAMED
server.jvm.additional=--enable-native-access=ALL-UNNAMED
# temporary files in the site's own directory, as Neo4j loads native code from them, which a /tmp mounted noexec refuses
server.jvm.additional=-Djava.io.tmpdir=/opt/breedgraph-demo/neo4j/tmp
server.jvm.additional=-Djna.tmpdir=/opt/breedgraph-demo/neo4j/tmp
server.jvm.additional=-Djansi.tmpdir=/opt/breedgraph-demo/neo4j/tmp
