# /etc/redis/redis-demo.conf: the demonstration site's Redis, beside production's on 6379. Nothing is saved: each
# reset empties it and loads the state store from the database again.
bind 127.0.0.1
port 6380
protected-mode yes
daemonize no
supervised systemd
dir /opt/breedgraph-demo/redis
save ""
appendonly no
maxmemory 256mb
maxmemory-policy noeviction
